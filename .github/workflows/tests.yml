name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        # Core stack only. The amortized BayesFlow tests (tests/test_amortized.py)
        # auto-skip via pytest.importorskip when TensorFlow/BayesFlow are absent,
        # so CI stays fast and does not pull the heavy TF stack. The committed
        # dataset (data/Concrete_Data.xls) and model (models/strength_model.json)
        # mean no network download or training is needed at test time.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost pymoo streamlit plotly openpyxl xlrd requests pytest

      - name: Run test suite
        run: pytest tests/ -q
