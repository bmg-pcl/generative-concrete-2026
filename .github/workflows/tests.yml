name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        # Core stack only. The amortized BayesFlow tests (tests/test_amortized.py)
        # auto-skip via pytest.importorskip when TensorFlow/BayesFlow are absent,
        # so CI stays fast and does not pull the heavy TF stack. The committed
        # dataset (data/Concrete_Data.xls) and model (models/strength_quantiles.json)
        # mean no network download or training is needed at test time.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn xgboost pymoo streamlit plotly openpyxl xlrd requests pytest pytest-cov ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run test suite (with coverage floor)
        # Floor (65%, R7.3b) sits below CI's measured no-TF coverage (69.98% on
        # 2026-07-10, run 86263426566 -- see docs/specs/R7-trustworthy-to-the-edge.md
        # R7.3b for the measurement). CI does NOT install the heavy TF/BayesFlow
        # stack, so the amortized-flow tests skip and src/amortized.py is largely
        # uncovered here -- hence CI coverage is lower than a full local run
        # (~78% with TF installed). Re-measure before ratcheting further; do not
        # guess the number. --cov=src covers the pure logic; app.py/ui/ are
        # exercised by the AppTest smoke test.
        run: pytest tests/ -q --cov=src --cov-report=term-missing --cov-fail-under=65
