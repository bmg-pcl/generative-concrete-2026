# Ruff config — defaults plus a slightly wider line length. We lint for real
# problems (unused imports/vars, undefined names, obvious bugs) and deliberately do
# NOT refactor working logic to satisfy stylistic rules.
line-length = 100
target-version = "py311"

[lint]
# Pyflakes F + pycodestyle E is enough to catch the findings we care about. This
# used to rely on ruff's IMPLICIT defaults, which drifted: with ruff unpinned in
# requirements.txt, 0.16.x widened the default rule set and CI started failing on
# 338 pre-existing stylistic findings before tests ever ran (R7.5 follow-up). The
# intent was always E+F, so select it EXPLICITLY — version-proof, unlike pinning.
# E501 (line too long) is noisy on the long help/markdown strings and docstrings
# here, so leave it off.
select = ["E", "F"]
ignore = ["E501"]

[lint.per-file-ignores]
# Tests set sys.path / importorskip before importing project modules, so imports
# legitimately follow statements (E402). Unused imports in __init__ re-exports are fine.
"tests/*" = ["E402"]
"**/__init__.py" = ["F401"]
